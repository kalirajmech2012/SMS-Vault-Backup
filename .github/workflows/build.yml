name: SMS Vault - One Click APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Select latest valid Android source ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, subprocess, zipfile, os
          root = pathlib.Path('.')
          names = subprocess.check_output(
              ['git', 'log', '--format=', '--name-only', '--diff-filter=AM', '--', '*.zip'],
              text=True).splitlines()
          seen = set()
          chosen = None
          for name in names:
              name = name.strip()
              if not name or name in seen:
                  continue
              seen.add(name)
              path = root / name
              if not path.is_file() or path.suffix.lower() != '.zip':
                  continue
              try:
                  with zipfile.ZipFile(path) as archive:
                      entries = archive.namelist()
                      roots = [str(pathlib.PurePosixPath(n).parent) for n in entries
                               if pathlib.PurePosixPath(n).name in ('settings.gradle', 'settings.gradle.kts')]
                      for prefix in roots:
                          prefix = '' if prefix == '.' else prefix + '/'
                          if any(prefix + f in entries for f in ('app/build.gradle', 'app/build.gradle.kts')):
                              chosen = (path, prefix)
                              break
              except (zipfile.BadZipFile, OSError):
                  pass
              if chosen:
                  break
          if not chosen:
              raise SystemExit('ERROR: No valid Android project ZIP found in committed repository files')
          path, prefix = chosen
          print('Selected Android source:', path)
          dest = pathlib.Path('extracted')
          dest.mkdir(exist_ok=True)
          with zipfile.ZipFile(path) as archive:
              for item in archive.infolist():
                  target = (dest / item.filename).resolve()
                  if not target.is_relative_to(dest.resolve()):
                      raise SystemExit('Unsafe ZIP entry: ' + item.filename)
              archive.extractall(dest)
          project = (dest / prefix).resolve()
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('PROJECT_DIR=' + str(project) + '\n')
          PY

      - name: Build debug APK
        shell: bash
        run: gradle -p "$PROJECT_DIR" :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK signing
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMS-Vault-Latest-APK
          path: ${{ env.APK }}
          if-no-files-found: error
          
