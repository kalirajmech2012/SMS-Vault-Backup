
name: Build SMS Vault APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -e
          ZIP="SMS-Vault-Auto-Android-Source.zip"
          test -f "$ZIP" || {
            echo "ERROR: ZIP not found: $ZIP"
            exit 1
          }
          mkdir -p extracted
          unzip -oq "$ZIP" -d extracted
          test -f extracted/settings.gradle
          test -f extracted/app/build.gradle
          echo "Android project extracted successfully"

      - name: Build Debug APK
        working-directory: extracted
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          set -e
          APK="extracted/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMS-Vault-APK
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
