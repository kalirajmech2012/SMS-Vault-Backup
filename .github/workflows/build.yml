name: SMS Vault - One Click APK

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: 'Source ZIP filename (leave blank to use latest committed ZIP)'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - '*.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Select ZIP and extract project
        shell: bash
        env:
          ZIP_INPUT: ${{ inputs.zip_name }}
        run: |
          set -euo pipefail
          if [[ -n "$ZIP_INPUT" ]]; then
            ZIP="$ZIP_INPUT"
          else
            ZIP="$(git log --format= --name-only --diff-filter=AM -- '*.zip' | sed '/^$/d' | while IFS= read -r f; do [[ -f "$f" ]] && { printf '%s\n' "$f"; break; }; done)"
          fi
          [[ -n "$ZIP" && -f "$ZIP" && "$ZIP" == *.zip ]] || { echo 'No source ZIP found'; exit 1; }
          echo "Using ZIP: $ZIP"
          mkdir -p extracted
          unzip -oq "$ZIP" -d extracted
          PROJECT="$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -n 1)"
          [[ -n "$PROJECT" ]] || { echo 'No Gradle Android project in ZIP'; exit 1; }
          PROJECT_DIR="$(dirname "$PROJECT")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Build debug APK
        shell: bash
        run: gradle -p "$PROJECT_DIR" :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK signing
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          [[ -s "$APK" ]] || exit 1
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: SMS-Vault-APK
          path: ${{ env.APK }}
          if-no-files-found: error
          
